<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bally Internal Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap');
        body { font-family: 'Sora', system-ui, sans-serif; background-color: #f0f4f8; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .badge-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .nav-link { transition: all 0.18s cubic-bezier(.4,0,.2,1); }
        .card-hover { transition: box-shadow 0.18s, transform 0.18s; }
        .card-hover:hover { box-shadow: 0 8px 32px rgba(22,163,74,0.10); transform: translateY(-1px); }
        .upcoming-tag { letter-spacing: 0.08em; }
        .sheet-formula-box {
            background: #1e293b;
            border-radius: 10px;
            padding: 14px 18px;
            color: #86efac;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.97rem;
            border: 1px solid #334155;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { AreaChart, Area, CartesianGrid, Tooltip, ResponsiveContainer, XAxis, YAxis, Legend } = Recharts;

        // --- Icons ---
        const Icon = ({ name, className }) => {
            const icons = {
                user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
                lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
                factory: <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>,
                leaf: <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.5 1.4 10.2A7 7 0 0 1 11 20c-5 0-8.5-9.1-8.5-15 0 0-2.4 2-2.4 4h0"/>,
                activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>,
                layers: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
                external: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
                fire: <path d="M12 2c0 0-5 4-5 9a5 5 0 0 0 10 0c0-5-5-9-5-9zm0 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>,
                wrench: <><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></>,
                motor: <><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 1 21 12a10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 4.93 4.93"/></>,
                grid: <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>,
                clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
                check: <polyline points="20 6 9 12 4 10"/>,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.activity}
                </svg>
            );
        };

        // --- Login ---
        const LoginScreen = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                if (username === 'Admin' && password === '12345') { onLogin('Admin'); }
                else if (username === 'User' && password === '1234') { onLogin('User'); }
                else { setError('Invalid Credentials. Please try again.'); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-900 via-slate-900 to-slate-800">
                    <div className="absolute inset-0 opacity-10" style={{backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 39px,#16a34a 39px,#16a34a 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,#16a34a 39px,#16a34a 40px)'}}></div>
                    <div className="relative bg-white/95 backdrop-blur p-9 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in border border-green-100">
                        <div className="flex justify-center mb-6">
                            <div className="bg-gradient-to-br from-green-600 to-green-800 p-4 rounded-2xl shadow-lg">
                                <Icon name="factory" className="w-10 h-10 text-white" />
                            </div>
                        </div>
                        <h2 className="text-2xl font-bold text-center text-gray-800 mb-1 tracking-tight">Bally OPS Portal</h2>
                        <p className="text-center text-gray-400 mb-8 text-sm">Internal Process Control System</p>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Username</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Icon name="user" className="w-4 h-4 text-gray-400" />
                                    </div>
                                    <input type="text" className="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all bg-gray-50 text-sm" placeholder="Enter username" value={username} onChange={(e) => setUsername(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Password</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Icon name="lock" className="w-4 h-4 text-gray-400" />
                                    </div>
                                    <input type="password" className="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all bg-gray-50 text-sm" placeholder="Enter password" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                            </div>
                            {error && <p className="text-red-500 text-xs text-center bg-red-50 py-2 rounded-lg border border-red-100">{error}</p>}
                            <button type="submit" className="w-full bg-gradient-to-r from-green-700 to-green-800 hover:from-green-800 hover:to-green-900 text-white font-semibold py-2.5 rounded-xl transition-all shadow-md text-sm mt-2">
                                Login to System
                            </button>
                        </form>
                        <div className="mt-6 text-center text-xs text-gray-300">
                            <p>Bally Jute Mills • Internal Use Only</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- External App Card ---
        const ExternalAppCard = ({ title, subtitle, href, icon, color, upcoming }) => {
            const colorMap = {
                blue:   { bg: 'bg-blue-50 hover:bg-blue-100', border: 'border-blue-200', icon: 'bg-blue-200 text-blue-700', title: 'text-blue-800', sub: 'text-blue-500' },
                orange: { bg: 'bg-orange-50 hover:bg-orange-100', border: 'border-orange-200', icon: 'bg-orange-200 text-orange-700', title: 'text-orange-800', sub: 'text-orange-500' },
                purple: { bg: 'bg-purple-50 hover:bg-purple-100', border: 'border-purple-200', icon: 'bg-purple-200 text-purple-700', title: 'text-purple-800', sub: 'text-purple-500' },
                teal:   { bg: 'bg-teal-50 hover:bg-teal-100', border: 'border-teal-200', icon: 'bg-teal-200 text-teal-700', title: 'text-teal-800', sub: 'text-teal-500' },
                gray:   { bg: 'bg-gray-50', border: 'border-gray-200', icon: 'bg-gray-200 text-gray-400', title: 'text-gray-400', sub: 'text-gray-400' },
            };
            const c = colorMap[color] || colorMap.blue;
            const Tag = upcoming ? 'div' : 'a';
            const props = upcoming ? {} : { href, target: '_blank', rel: 'noopener noreferrer' };
            return (
                <Tag {...props} className={`group flex items-center justify-between w-full ${c.bg} border ${c.border} p-4 rounded-xl transition-all card-hover ${upcoming ? 'cursor-not-allowed opacity-75' : 'cursor-pointer'}`}>
                    <div className="flex items-center gap-3">
                        <div className={`${c.icon} p-2.5 rounded-xl`}>
                            <Icon name={icon} className="w-5 h-5" />
                        </div>
                        <div>
                            <h4 className={`text-sm font-bold ${c.title}`}>{title}</h4>
                            <p className={`text-xs ${c.sub}`}>{subtitle}</p>
                        </div>
                    </div>
                    {upcoming
                        ? <span className="upcoming-tag text-xs font-bold bg-amber-100 text-amber-600 border border-amber-200 px-2 py-0.5 rounded-full">UPCOMING</span>
                        : <Icon name="external" className={`w-4 h-4 ${c.sub} opacity-0 group-hover:opacity-100 transition-opacity`} />
                    }
                </Tag>
            );
        };

        // --- Dashboard ---
        const Dashboard = ({ userRole, onLogout }) => {
            const [activeTab, setActiveTab] = useState('overview');
            const [time, setTime] = useState(new Date().toLocaleTimeString());
            const [juteStatsData, setJuteStatsData] = useState(null);
            const [juteGraphData, setJuteGraphData] = useState(null);
            const [juteReceivedData, setJuteReceivedData] = useState(null);

            useEffect(() => {
                const t = setInterval(() => setTime(new Date().toLocaleTimeString()), 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                const fetchSheetData = async () => {
                    const apiKey = "AIzaSyAriKmI0OQAzmO3uH3EAK7598TkQBYT52I";
                    const sheetId = "1V2eNNzVvfSSCvkAp4PBif1Bpbf8ap_wa78m_eIlwn0U";
                    const sheetName = "dashboard";
                    const urlStats = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!A2:F2?key=${apiKey}`;
                    const urlGraph = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!G2:H9?key=${apiKey}`;
                    const urlRec   = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!I2:J9?key=${apiKey}`;
                    try {
                        const resStats = await fetch(urlStats);
                        const jsonStats = await resStats.json();
                        if (jsonStats.values && jsonStats.values.length > 0) {
                            const row = jsonStats.values[0];
                            setJuteStatsData({ startDate: row[0]||"N/A", endDate: row[1]||"N/A", grade: row[2]||"0", moisture: row[3]||"0", dust: row[4]||"0", weight: row[5]||"0" });
                        }
                        const resGraph = await fetch(urlGraph);
                        const jsonGraph = await resGraph.json();
                        if (jsonGraph.values && jsonGraph.values.length > 0) {
                            setJuteGraphData(jsonGraph.values.map(row => ({ time: row[0], actual: parseFloat(row[1])||0, target: 0 })));
                        }
                        const resRec = await fetch(urlRec);
                        const jsonRec = await resRec.json();
                        if (jsonRec.values && jsonRec.values.length > 0) { setJuteReceivedData(jsonRec.values); }
                    } catch (err) { console.error("Sheet fetch error:", err); }
                };
                fetchSheetData();
            }, []);

            const getDataForTab = (tab) => {
                if (tab === 'jute') {
                    const s = juteStatsData || { startDate: "Loading...", endDate: "...", grade: "-", moisture: "-", dust: "-", weight: "-" };
                    return {
                        title: "Jute Department Overview",
                        graphTitle: "Last 7 Days Grade Down",
                        rightPanelTitle: "Last 7 Days Received",
                        stats: [
                            { label: "Start Date", val: s.startDate, color: "text-blue-600" },
                            { label: "End Date", val: s.endDate, color: "text-slate-800" },
                            { label: "Avg Grade Down %", val: s.grade + "%", color: "text-slate-800" },
                            { label: "Moisture %", val: s.moisture + "%", color: "text-yellow-600" },
                            { label: "Dust %", val: s.dust + "%", color: "text-yellow-600" },
                            { label: "Weight %", val: s.weight + "%", color: "text-yellow-600" },
                        ],
                        chartData: juteGraphData || [{ time: 'Loading', actual: 0 }],
                        machines: juteReceivedData
                            ? juteReceivedData.map(row => ({ id: row[0], type: "Raw Jute", displayValue: row[1], isReceived: true }))
                            : []
                    };
                }
                // Default overview
                return {
                    title: "Global Plant Overview",
                    graphTitle: "Performance Trend",
                    rightPanelTitle: "Key Machine Status",
                    stats: [
                        { label: "Total Efficiency", val: "88.4%", color: "text-green-600" },
                        { label: "Total Production", val: "142 MT", color: "text-slate-800" },
                        { label: "Active Machines", val: "412", color: "text-slate-800" },
                        { label: "Maintenance Issues", val: "3", color: "text-red-600" },
                    ],
                    chartData: [
                        { time: '08:00', target: 400, actual: 380 },
                        { time: '10:00', target: 400, actual: 410 },
                        { time: '12:00', target: 400, actual: 390 },
                        { time: '14:00', target: 400, actual: 405 },
                    ],
                    machines: [
                        { id: "LM-01", type: "Hessian Loom", status: "Running", eff: 92 },
                        { id: "SP-12", type: "Slip Draft",   status: "Running", eff: 95 },
                        { id: "BT-04", type: "Softener",     status: "Stopped", eff: 0  },
                    ]
                };
            };

            const currentData = getDataForTab(activeTab);

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden animate-fade-in">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-900 text-white flex flex-col">
                        <div className="p-6 border-b border-slate-800">
                            <h2 className="text-lg font-bold text-green-400 tracking-widest uppercase mono">Bally OPS</h2>
                            <p className="text-xs text-slate-400 mt-0.5">Internal Control Portal</p>
                        </div>

                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            {/* Overview */}
                            <button onClick={() => setActiveTab('overview')} className={`nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm ${activeTab === 'overview' ? 'bg-green-700 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <Icon name="activity" className="w-4 h-4" /> Overview
                            </button>

                            {/* Departments */}
                            <div className="text-xs font-bold text-slate-500 mt-5 mb-2 px-2 uppercase tracking-widest">Departments</div>
                            <button onClick={() => setActiveTab('jute')} className={`nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm ${activeTab === 'jute' ? 'bg-green-700 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <Icon name="layers" className="w-4 h-4" /> Jute Dept. Overview
                            </button>

                            {/* External Apps */}
                            <div className="text-xs font-bold text-slate-500 mt-5 mb-2 px-2 uppercase tracking-widest">Applications</div>

                            {/* EMMS */}
                            <a href="https://emms-bally-jute-mill.vercel.app/?_vercel_share=YqIewTfJI3l2nOCyIY9DTkYaGORetKYE" target="_blank" rel="noopener noreferrer"
                                className="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white">
                                <Icon name="grid" className="w-4 h-4 text-blue-400" />
                                <span>EMMS</span>
                                <Icon name="external" className="w-3 h-3 ml-auto opacity-50" />
                            </a>

                            {/* FireERP */}
                            <a href="https://script.google.com/macros/s/AKfycbyRQSIyjEIORFeIVm3emyRKEX3P_iwPvT-cY1YWswUnyDkT-yHxJgBQArKqYvtg0BbLmQ/exec" target="_blank" rel="noopener noreferrer"
                                className="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white">
                                <Icon name="fire" className="w-4 h-4 text-orange-400" />
                                <span>FireERP</span>
                                <Icon name="external" className="w-3 h-3 ml-auto opacity-50" />
                            </a>

                            {/* Maintenance ERP */}
                            <a href="https://script.google.com/macros/s/AKfycbyDVtOUO5K8qspPKBP0eu4QJrcDO-3zOt_yr-I_7YqQtGyf9qo93hUPlW5Ec0Aro3c8vA/exec" target="_blank" rel="noopener noreferrer"
                                className="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white">
                                <Icon name="wrench" className="w-4 h-4 text-purple-400" />
                                <span>Maintenance ERP</span>
                                <Icon name="external" className="w-3 h-3 ml-auto opacity-50" />
                            </a>

                            {/* Motor ERP */}
                            <a href="https://teal-sfogliatella-5e64fc.netlify.app/" target="_blank" rel="noopener noreferrer"
                                className="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white">
                                <Icon name="motor" className="w-4 h-4 text-teal-400" />
                                <span>Motor ERP</span>
                                <Icon name="external" className="w-3 h-3 ml-auto opacity-50" />
                            </a>

                            {/* Upcoming */}
                            <div className="text-xs font-bold text-slate-600 mt-5 mb-2 px-2 uppercase tracking-widest">Upcoming</div>

                            <div className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 cursor-not-allowed select-none">
                                <Icon name="check" className="w-4 h-4 text-amber-500" />
                                <span>IMS Check List</span>
                                <span className="ml-auto text-xs bg-amber-900/40 text-amber-400 border border-amber-700/40 px-1.5 py-0.5 rounded-full upcoming-tag font-bold">SOON</span>
                            </div>
                            <div className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 cursor-not-allowed select-none">
                                <Icon name="clock" className="w-4 h-4 text-amber-500" />
                                <span>Task Delegation</span>
                                <span className="ml-auto text-xs bg-amber-900/40 text-amber-400 border border-amber-700/40 px-1.5 py-0.5 rounded-full upcoming-tag font-bold">SOON</span>
                            </div>

                            {/* Admin */}
                            {userRole === 'Admin' && (
                                <div className="mt-5 p-3 bg-slate-800 rounded-xl border border-red-900/30">
                                    <div className="flex items-center gap-2 text-red-400 text-xs font-bold mb-2">
                                        <Icon name="shield" className="w-3 h-3" /> ADMIN CONTROLS
                                    </div>
                                    <button className="w-full text-left text-xs text-slate-300 hover:text-white py-1">Adjust Targets</button>
                                </div>
                            )}
                        </nav>

                        <div className="p-4 border-t border-slate-800">
                            <button onClick={onLogout} className="w-full flex items-center justify-center gap-2 text-xs text-slate-500 hover:text-red-400 transition-colors py-1">
                                <Icon name="logOut" className="w-3 h-3" /> Log Out
                            </button>
                        </div>
                    </div>

                    {/* Main */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {/* Header */}
                        <header className="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 shadow-sm z-10">
                            <h1 className="text-lg font-bold text-slate-800 capitalize tracking-tight">{currentData.title}</h1>
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden md:block">
                                    <p className="text-xs font-bold text-slate-700">{userRole === 'Admin' ? 'Administrator' : 'Shift User'}</p>
                                    <p className="text-xs text-slate-400 mono">{time}</p>
                                </div>
                                <div className="w-9 h-9 rounded-xl bg-green-100 flex items-center justify-center text-green-700 font-bold text-sm">
                                    {userRole[0]}
                                </div>
                            </div>
                        </header>

                        {/* Body */}
                        <div className="flex-1 overflow-auto p-6">
                            <div className="space-y-6">

                                {/* Stats */}
                                <div className={`grid grid-cols-2 md:grid-cols-${activeTab === 'jute' ? '6' : '4'} gap-4`}>
                                    {currentData.stats.map((stat, idx) => (
                                        <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 animate-fade-in card-hover" style={{animationDelay:`${idx*40}ms`}}>
                                            <p className="text-xs text-slate-400 uppercase tracking-wide mb-1">{stat.label}</p>
                                            <p className={`text-lg font-bold mono ${stat.color}`}>{stat.val}</p>
                                        </div>
                                    ))}
                                </div>

                                {/* Chart + Panel */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-bold text-slate-700">{currentData.graphTitle}</h3>
                                            {activeTab !== 'jute' && (
                                                <span className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-400 mono">Last 4 Intervals</span>
                                            )}
                                        </div>
                                        <div className="h-56">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <AreaChart data={currentData.chartData}>
                                                    <defs>
                                                        <linearGradient id="colorProd" x1="0" y1="0" x2="0" y2="1">
                                                            <stop offset="5%" stopColor="#16a34a" stopOpacity={0.7}/>
                                                            <stop offset="95%" stopColor="#16a34a" stopOpacity={0}/>
                                                        </linearGradient>
                                                    </defs>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                                                    <XAxis dataKey="time" tick={{fontSize:11, fill:'#94a3b8'}} axisLine={false} tickLine={false}/>
                                                    <YAxis tick={{fontSize:11, fill:'#94a3b8'}} axisLine={false} tickLine={false}/>
                                                    <Tooltip contentStyle={{borderRadius:10,border:'1px solid #e2e8f0',fontSize:12}}/>
                                                    <Area type="monotone" dataKey="actual" stroke="#16a34a" strokeWidth={2} fill="url(#colorProd)" name={activeTab === 'jute' ? "Grade Down %" : "Actual Output"}/>
                                                    {activeTab !== 'jute' && <Area type="monotone" dataKey="target" stroke="#94a3b8" fill="none" strokeDasharray="5 5" name="Target"/>}
                                                    <Legend iconType="circle" iconSize={8}/>
                                                </AreaChart>
                                            </ResponsiveContainer>
                                        </div>

                                        {/* Open App Button — always visible */}
                                        <div className="mt-5 pt-4 border-t border-slate-100">
                                            <a
                                                href="https://script.google.com/a/macros/yajurfibres.com/s/AKfycbzBVCAE4bkNt0HB2UzCbvE23clIc69iWy39l8wP_4YQXAXbai9upavKJJWkww9s82pU/exec"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="group flex items-center justify-between w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 p-4 rounded-xl transition-all cursor-pointer card-hover"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="bg-blue-200 p-2 rounded-xl text-blue-700">
                                                        <Icon name="external" className="w-5 h-5" />
                                                    </div>
                                                    <div>
                                                        <h4 className="text-sm font-bold text-blue-800 group-hover:text-blue-900">Log in to App for Full View</h4>
                                                        <p className="text-xs text-blue-500">Click here to access detailed reports</p>
                                                    </div>
                                                </div>
                                                <Icon name="activity" className="w-4 h-4 text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity" />
                                            </a>
                                        </div>

                                        {/* Apps Section Below Graph */}
                                        <div className="mt-4 pt-4 border-t border-slate-100">
                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Quick Access — Applications</p>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <ExternalAppCard
                                                    title="EMMS"
                                                    subtitle="Energy Monitoring System"
                                                    href="https://emms-bally-jute-mill.vercel.app/?_vercel_share=YqIewTfJI3l2nOCyIY9DTkYaGORetKYE"
                                                    icon="grid" color="blue"
                                                />
                                                <ExternalAppCard
                                                    title="FireERP"
                                                    subtitle="Fire Safety Management"
                                                    href="https://script.google.com/macros/s/AKfycbyRQSIyjEIORFeIVm3emyRKEX3P_iwPvT-cY1YWswUnyDkT-yHxJgBQArKqYvtg0BbLmQ/exec"
                                                    icon="fire" color="orange"
                                                />
                                                <ExternalAppCard
                                                    title="Maintenance ERP"
                                                    subtitle="Maintenance Tracking"
                                                    href="https://script.google.com/macros/s/AKfycbyDVtOUO5K8qspPKBP0eu4QJrcDO-3zOt_yr-I_7YqQtGyf9qo93hUPlW5Ec0Aro3c8vA/exec"
                                                    icon="wrench" color="purple"
                                                />
                                                <ExternalAppCard
                                                    title="Motor ERP"
                                                    subtitle="Motor Management System"
                                                    href="https://script.google.com/a/macros/ballyjute.com/s/AKfycbzJgHsLQi3LneltrVgrSzVkGeyxlWeiaX29NEu_jI5A32HRXuoJgcgkKGFsNWo-RdNXKA/exec"
                                                    icon="motor" color="teal"
                                                />
                                                <ExternalAppCard
                                                    title="IMS Check List"
                                                    subtitle="Integrated Mgmt System"
                                                    icon="check" color="gray" upcoming
                                                />
                                                <ExternalAppCard
                                                    title="Task Delegation"
                                                    subtitle="Workflow & Assignment"
                                                    icon="clock" color="gray" upcoming
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Panel */}
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-700 mb-4">{currentData.rightPanelTitle}</h3>
                                        <div className="space-y-2">
                                            {currentData.machines.map((m, i) => (
                                                <div key={i} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                                                    <div>
                                                        <p className="font-bold text-slate-700 text-xs mono">{m.id}</p>
                                                        <p className="text-xs text-slate-400">{m.type}</p>
                                                    </div>
                                                    <div className="text-right flex items-center gap-2">
                                                        {!m.isReceived && (
                                                            <span className={`inline-block w-2 h-2 rounded-full ${m.status === 'Running' ? 'bg-green-500 badge-pulse' : 'bg-red-500'}`}></span>
                                                        )}
                                                        <span className={`font-semibold text-xs mono ${m.isReceived ? 'text-slate-700' : m.status === 'Running' ? 'text-green-700' : 'text-red-500'}`}>
                                                            {m.isReceived ? m.displayValue : `${m.eff}% Eff`}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                            {currentData.machines.length === 0 && (
                                                <p className="text-sm text-slate-400 text-center py-6">No data available.</p>
                                            )}
                                        </div>

                                        <div className="mt-4 pt-3 border-t border-slate-100 text-center">
                                            <button className="text-xs text-green-600 font-semibold hover:underline">
                                                {activeTab === 'jute' ? 'View Full History' : 'View All Machines'} &rarr;
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [userRole, setUserRole] = useState(null);
            return (
                <>
                    {view === 'login' && <LoginScreen onLogin={role => { setUserRole(role); setView('dashboard'); }} />}
                    {view === 'dashboard' && <Dashboard userRole={userRole} onLogout={() => { setUserRole(null); setView('login'); }} />}
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
